name: 🚀 OpenRadar 每日定时抓取与自动部署

on:
  schedule:
    # 每天北京/台北时间（UTC+8）上午 09:15 准时执行 (01:15 UTC)
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Shanghai'
      BOT_WEBHOOK: ${{ secrets.BOT_WEBHOOK }} # 自动读取机器人 Webhook 密钥
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装采集依赖
        run: pip install -r scripts/requirements.txt

      - name: 执行各分类 Top 10 抓取与群机器人推送
        run: python scripts/scraper.py

      - name: 自动同步数据文件到仓库
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/radar_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(radar): 自动更新技术雷达数据 ($(date +'%Y-%m-%d %H:%M') UTC+8)" && git push)

      - name: 准备 GitHub Pages 发布制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 自动发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
